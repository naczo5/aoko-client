name: package windows

# Builds the Windows binary and a zip that can be run: `aoko.exe` plus the two
# native bridges, which have to sit beside it because the loader picks between
# them from the detected Minecraft version.
#
# This is deliberately its own workflow rather than `release.yml`'s publish step.
# That file also builds the C++ bridges with a JDK and a hand-unpacked MinGW, and
# it stops on purpose (see MIGRATION_ARCHITECTURE.md §9 item 3) rather than
# package an artifact nothing built. Here the bridges are compiled by the steps
# below: `*.dll` is in `.gitignore`, so a checkout has none.
#
# The GUI fonts and the GTB wordlist are `include_bytes!`/`include_str!` in
# `aoko-app`, so the zip carries no `Data/` directory. The one exception is the
# in-game overlay face: the C++ bridge rasterises its own ImGui atlas at runtime
# and can only read a file, so `Manrope-Medium.ttf` ships beside the DLLs.

# `workflow_dispatch` is only registered once this file is on the default branch,
# so the push trigger is what makes it runnable from `rust` today. It fires only
# when this file itself changes, which during the migration is the only reason to
# re-run it; the dispatch path is for a ref that wants a zip without an edit.
on:
  push:
    paths:
      - '.github/workflows/package-windows.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the zip to (blank: upload an artifact only)'
        required: false
        type: string
      ref:
        description: 'Git ref to build'
        required: false
        default: rust
        type: string

permissions:
  contents: write

concurrency:
  group: package-windows
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: windows zip
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # `McInjector/build.bat` defaults to a doubled `mingw64\mingw64` path and
      # honours this override instead; it is where the archive below unpacks to.
      AOKO_GXX: 'C:\mingw64\bin\g++.exe'
    steps:
      - name: check out the ref to package
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The bridges are `*.dll`, which `.gitignore` excludes, so a checkout has
      # none and they have to be compiled here. Both scripts read the JDK's
      # `include` directory from `JAVA_HOME`, and both link `-shared` against the
      # Win32 import libraries, so the two steps below are prerequisites rather
      # than conveniences.
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: set up MinGW-w64
        shell: pwsh
        run: |
          # The toolchain the shipped releases were built with: GCC 13.2.0, win32
          # threads, UCRT runtime.
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/13.2.0-rt_v11-rev1/x86_64-13.2.0-release-win32-seh-ucrt-rt_v11-rev1.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'mingw.7z'
          curl.exe -fL --retry 3 -o $archive $url
          if (Test-Path 'C:\mingw64') { Remove-Item -Recurse -Force 'C:\mingw64' }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $sevenZip x $archive -oC:\ -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract MinGW (exit $LASTEXITCODE)." }
          & 'C:\mingw64\bin\g++.exe' --version | Select-Object -First 1

      - name: build the native bridges
        shell: cmd
        run: .\build_dll.bat

      # Registry and git caches only: a `target` cache for gpui is several
      # gigabytes and would be evicted between runs anyway, so the one cold build
      # per package is cheaper than a cache that never hits.
      - name: cache cargo caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-package-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-package-

      - name: toolchain
        run: rustup show

      - name: build
        run: cargo build -p aoko-app --release --bin aoko

      - name: stage the runnable directory
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item 'target\release\aoko.exe' $stage
          # Both bridges ship: the loader selects `bridge_261.dll` for a 26.x or
          # 1.21 client and `bridge.dll` for everything else, and a game that
          # names no version falls back to the legacy one. Removing either would
          # break injection for half the supported versions.
          Copy-Item 'McInjector\bridge.dll' $stage
          Copy-Item 'McInjector\bridge_261.dll' $stage

          # The overlay face. Both bridges look for `Manrope-Medium.ttf` beside the
          # DLL before falling back to ImGui's built-in bitmap font, and without it
          # the in-game HUD, nametags and module list render in that 13 px fallback:
          # `bridge_debug.log` said "No overlay font found (Manrope/Minecraftia),
          # using default ImGui font." The OFL requires the licence to travel with
          # the font, so `Manrope-OFL.md` ships too.
          Copy-Item 'McInjector\assets\Manrope-Medium.ttf' $stage
          Copy-Item 'McInjector\assets\Manrope-OFL.md' $stage

          $readme = @'
          aoko — Rust/GPUI host

          Run aoko.exe. Keep bridge.dll and bridge_261.dll beside it: they are the
          native bridges, and which one loads is decided by the Minecraft version
          detected in the client's command line.

          Keep Manrope-Medium.ttf beside them too. The in-game overlay loads it by
          name from the bridge's own folder; without it the HUD, nametags and module
          list fall back to ImGui's small bitmap face. Manrope-OFL.md is its licence
          and has to travel with it.

          The first launch writes its profile under %APPDATA%\Aoko. No installer, no
          runtime to install: the GUI fonts and the word list are compiled into the
          exe.
          '@
          Set-Content -LiteralPath (Join-Path $stage 'README.txt') -Value $readme -Encoding utf8

          Get-ChildItem $stage | Format-Table Name, Length

      - name: zip
        shell: pwsh
        run: |
          $label = if ('${{ inputs.tag }}') { '${{ inputs.tag }}' } else { 'dev' }
          $zip = Join-Path $env:GITHUB_WORKSPACE "aoko-$label-windows.zip"
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'stage\*') -DestinationPath $zip
          Get-Item $zip | Format-Table Name, Length
          "AOKO_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoko-windows-zip
          path: ${{ env.AOKO_ZIP }}
          if-no-files-found: error

      - name: attach the zip to the release
        if: inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ inputs.tag }}' $env:AOKO_ZIP --clobber
